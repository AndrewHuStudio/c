interface:
  display_name: "门诊平面结构化标注"
  short_description: "逐张标注医院概念平面；支持完整房名核对及区域级逐空间粗轮廓。"
  default_prompt: "使用 $outpatient-plan-annotation 标注这张门诊概念平面；输出具名原图、标注.svg、annotation.json、标注说明.md。SVG 显示空间编号、具体名称和标准功能类别；JSON 用 name 保留具体名称、type 使用共享类别代码。局部图把数字写进对应房间内部，固定核对号不重排；庭院作为独立空间保留且不计面积；标注说明只留简短概览和待确认问题，更新保留用户填写，已处理内容外部归档。清晰门洞和无门开口画红点，并同步 access/openings 及两端空间；半墙等无具体门位的概念连通不编造坐标。区域级图例图采用regional_coarse：可辨独立空间逐个保留粗轮廓与S号，原图缺名保持unknown，不要求逐项猜名；区域外轮廓另作SVG概览，不重复计面积；按本轮范围和全房名分别报告完成状态。需要逐名确认的空间在完整原图上框选，按相邻片区从上到下连续核对，边栏标签顺序一致且引线不交叉。"
